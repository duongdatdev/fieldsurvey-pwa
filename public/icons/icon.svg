<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#042f2e" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#grad)" />
  
  <!-- Subtle inner border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="4" />

  <!-- Clipboard Sheet -->
  <g filter="url(#shadow)">
    <rect x="120" y="100" width="272" height="330" rx="24" fill="#ffffff" />
    
    <!-- Clipboard Top Clip -->
    <rect x="186" y="76" width="140" height="48" rx="14" fill="#134e4a" />
    <circle cx="256" cy="100" r="10" fill="#2dd4bf" />

    <!-- Form Lines -->
    <rect x="160" y="170" width="130" height="18" rx="9" fill="#0f766e" />
    <rect x="160" y="210" width="192" height="12" rx="6" fill="#cbd5e1" />
    <rect x="160" y="238" width="160" height="12" rx="6" fill="#cbd5e1" />
    
    <!-- Checkbox 1 (Checked) -->
    <rect x="160" y="280" width="30" height="30" rx="8" fill="#0d9488" />
    <path d="M168 295 L174 301 L183 289" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="206" y="289" width="140" height="12" rx="6" fill="#64748b" />

    <!-- Checkbox 2 (Checked) -->
    <rect x="160" y="330" width="30" height="30" rx="8" fill="#0d9488" />
    <path d="M168 345 L174 351 L183 339" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="206" y="339" width="120" height="12" rx="6" fill="#64748b" />
    
    <!-- Sync / Signal badge in corner -->
    <circle cx="360" cy="380" r="44" fill="#042f2e" />
    <path d="M346 380 A 14 14 0 0 1 372 372 L372 366 M374 380 A 14 14 0 0 1 348 388 L348 394" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round" />
    <polygon points="372,364 378,372 366,372" fill="#2dd4bf" />
    <polygon points="348,396 342,388 354,388" fill="#2dd4bf" />
  </g>
</svg>
